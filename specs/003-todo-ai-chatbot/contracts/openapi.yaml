openapi: 3.1.0
info:
  title: Todo AI Chatbot API
  version: 1.0.0
  description: API for managing conversational todo interactions.

paths:
  /api/chatkit/session:
    post:
      summary: Create a new ChatKit session
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                conversation_id:
                  type: string
                  format: uuid
                  description: Optional ID for resuming a conversation
      responses:
        '200':
          description: ChatKit client secret returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  client_secret:
                    type: string
                  conversation_id:
                    type: string
                    format: uuid
        '401':
          description: Unauthorized

  /api/chat:
    post:
      summary: Direct stateless chat endpoint (for fallback/testing)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                conversation_id:
                  type: string
                  format: uuid
                message:
                  type: string
      responses:
        '200':
          description: Assistant response
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                  conversation_id:
                    type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
